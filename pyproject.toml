[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstralix"
version = "0.5.1"
description = "Abstralix - Declarative Architecture & Intent Compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
abx = "abstralix.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstralix*"]
